<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#2C47A3"/><g transform="translate(-35.839999999999975 -35.839999999999975) scale(1.14)"><!-- libri su uno scaffale (uno inclinato verso destra, come «il prossimo»), in ottone su blu inchiostro, dentro la cornice di un ex libris -->
<g id="art">
  <!-- cornice ex libris -->
  <rect x="118" y="118" width="276" height="276" rx="26" fill="none" stroke="#EBD9A6" stroke-width="7" opacity=".55"/>
  <!-- scaffale -->
  <rect x="150" y="338" width="212" height="12" rx="6" fill="#EBD9A6"/>
  <!-- libro 1 -->
  <rect x="164" y="196" width="42" height="142" rx="6" fill="#EBD9A6"/>
  <rect x="164" y="218" width="42" height="7" fill="#2C47A3" opacity=".55"/>
  <rect x="164" y="306" width="42" height="7" fill="#2C47A3" opacity=".55"/>
  <!-- libro 2, il piu' alto -->
  <rect x="214" y="166" width="50" height="172" rx="6" fill="#F4E8C4"/>
  <rect x="214" y="190" width="50" height="8" fill="#2C47A3" opacity=".55"/>
  <rect x="214" y="304" width="50" height="8" fill="#2C47A3" opacity=".55"/>
  <!-- libro 3, inclinato: il prossimo -->
  <g transform="rotate(16 290 338)">
    <rect x="276" y="200" width="40" height="138" rx="6" fill="#D9B45E"/>
    <rect x="276" y="222" width="40" height="7" fill="#2C47A3" opacity=".55"/>
    <rect x="276" y="306" width="40" height="7" fill="#2C47A3" opacity=".55"/>
  </g>
</g>
</g></svg>